[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aqdx-v3-validator"
version = "1.0.2"
description = "Validator and auto-repair engine for the AQDx Standard Format v3.0"
readme = "readme.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.12.0,<3",
    "pandas>=3.0.0,<4",
    "pyarrow>=24.0.0,<25",
    "openpyxl>=3.1.0,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ipykernel>=7.0.0"
]

[project.scripts]
validate-aqdx = "validate_aqdx:main"

[tool.setuptools]
py-modules = ["validate_aqdx"]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
pythonpath = ["src"]
