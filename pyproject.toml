[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aqdx-v3-validator"
version = "1.1.0"
description = "Validator and auto-repair engine for the AQDx Standard Format v3.0"
readme = "readme.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.12.0,<3",
    "pandas>=3.0.0,<4",
    "pyarrow>=24.0.0,<25",
    "openpyxl>=3.1.0,<4",
]

[project.optional-dependencies]
performance = [
    "polars>=2.1.0,<3",
]
dev = [
    "pytest>=8.0.0",
    "polars>=2.0.0,<3",
]

[project.scripts]
validate-aqdx = "validate_aqdx:main"
validate-aqdx-performance = "validate_aqdx_performance:main"

[tool.setuptools]
py-modules = ["validate_aqdx", "validate_aqdx_performance"]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
